{% extends "user/base.html" %}

{% block title %}Edit: {{ model.name }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-pencil"></i> Edit Model</h1>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 col-md-10">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Model Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ model.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="model_type" class="form-label">Model Type</label>
                        <input type="text" class="form-control" id="model_type" name="model_type" value="{{ model.model_type or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ model.description or '' }}</textarea>
                    </div>

                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {{ 'checked' if model.is_active }}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check"></i> Save Changes
                        </button>
                        <a href="{{ url_for('user_models.detail_model', model_id=model.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
