{% extends "user/base.html" %}

{% block title %}Edit: {{ project.name }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-pencil"></i> Edit Project</h1>
        <p class="text-muted">Edit "{{ project.name }}" settings.</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 col-md-10">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Project Name *</label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="name" 
                               name="name" 
                               value="{{ project.name }}" 
                               required
                               placeholder="Enter project name">
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" 
                                  id="description" 
                                  name="description" 
                                  rows="3"
                                  placeholder="Describe your project...">{{ project.description if project.description else '' }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" 
                                   type="checkbox" 
                                   id="is_active" 
                                   name="is_active" 
                                   {% if project.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">
                                Active Project
                            </label>
                            <div class="form-text">Active projects can be scheduled and executed.</div>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check"></i> Save Changes
                        </button>
                        <a href="{{ url_for('user_projects.detail_project', project_id=project.id) }}" 
                           class="btn btn-outline-secondary btn-lg">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
